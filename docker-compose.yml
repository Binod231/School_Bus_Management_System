services:
  # 1. Redis Cache
  redis:
    image: redis:7-alpine
    container_name: school_bus_redis
    restart: always
    ports:
      - "6379:6379"

  # 2. Web Application (Connects to AWS RDS via .env)
  school_bus_web:
    build: .
    container_name: school_bus_web
    restart: always
    command: >
      sh -c "cd /app/app/migrations &&
             alembic upgrade head &&
             cd /app &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000"
    volumes:
      - .:/app
    ports:
      - "80:8000"
    depends_on:
      - redis
    env_file:
      - .env
