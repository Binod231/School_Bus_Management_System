name: Backend CI/CD Pipeline

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  ci-check:
    name: Syntax & Integrity Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify Python Compilation
        run: |
          python -m py_compile $(find app -name "*.py")
          echo "All Python files compiled successfully without syntax errors."

  deploy:
    name: Deploy to EC2
    needs: ci-check
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: ${{ secrets.EC2_PORT || 22 }}
          script_stop: true
          script: |
            APP_DIR="${{ secrets.EC2_APP_DIR || '/home/ubuntu/School_Bus_Management_System' }}"
            echo "Target Directory: $APP_DIR"
            cd "$APP_DIR" || { echo "Directory not found!"; exit 1; }

            echo "Fetching latest changes from origin/main..."
            git fetch origin main
            git reset --hard origin/main

            # Determine docker compose command
            if docker compose version &> /dev/null; then
              DOCKER_COMPOSE="docker compose"
            else
              DOCKER_COMPOSE="docker-compose"
            fi
            echo "Using compose command: $DOCKER_COMPOSE"

            echo "Rebuilding and restarting production containers..."
            $DOCKER_COMPOSE up -d --build

            echo "Waiting for services to initialize..."
            sleep 10

            echo "Container Status:"
            $DOCKER_COMPOSE ps

            echo "Verifying application response..."
            curl -f http://127.0.0.1:8000/docs > /dev/null && echo "Backend is healthy and serving requests!"

            # Clean up old unused images to save disk space
            docker image prune -f

            echo "Deployment successful!"
