version: '3.8'

services:
  school_bus_web:
    build: .
    container_name: school_bus_web_prod
    restart: always
    command: >
      sh -c "alembic upgrade head && 
             uvicorn app.main:app --host 0.0.0.0 --port 8000"
    ports:
      - "80:8000"
    env_file:
      - .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
